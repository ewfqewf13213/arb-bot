name: arb-screener
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: arb-screener
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: |
            state-
      - run: pip install ccxt aiogram
      - run: python arb_once.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          COINGECKO_KEY: ${{ secrets.COINGECKO_KEY }}
          LOOPS: "4"
          INTERVAL: "60"
          REPEAT_MIN: "30"
          MIN_CHAIN: "1.0"
          MIN_TRI: "0.3"
          CHAIN_TRADE_USD: "1000"
          TRADE_USD: "300"
